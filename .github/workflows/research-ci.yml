name: Silver Scan explorer and research CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, public-alpha]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pure test dependency
        run: python -m pip install pytest
      - name: Compile Python backend and tests
        run: python -m compileall -q app tests
      - name: Unit tests — market providers and reorg-safe indexing
        run: python -m pytest -q tests/test_market_data.py tests/test_indexer_canonical.py tests/test_http_api.py tests/test_coverage.py tests/test_accounts.py tests/test_discovery.py
      - name: Validate static browser scripts
        run: |
          node --check app/static/research.js
          node --check app/static/explorer.js
          node --check app/static/charts.js
          node --check app/static/features.js
          node --check app/static/data-hub.js
          node --check app/static/theme.js
          node --check app/static/portfolio.js
          node --check app/static/insights.js
          node --check app/static/exchanges.js
          node --check app/static/compare.js
          node --check app/static/feature-detail.js
          node --check app/static/_worker.js
          node --check app/static/alpha.js
          node --test tests/test_static_ui.test.mjs tests/test_theme_contrast.test.mjs tests/test_alpha_worker.test.mjs
      # Existing tests/test_adapters.py requires a running Bitcoin Silver regtest
      # node on localhost:18443. It is exercised separately by the operator.
