# SilverScan Cloudflare Workers public alpha (existing Worker: silver-scan).
# Default deploy: npx wrangler deploy
# HTML/CSS/JS are served from app/static; /api/* uses the
# restricted, read-only Worker entrypoint. No user accounts or signing.
name = "silver-scan"
main = "./app/static/_worker.js"
compatibility_date = "2026-10-29"

[assets]
directory = "./app/static"
binding = "ASSETS"
run_worker_first = ["/api/*"]
